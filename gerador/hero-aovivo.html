<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
html,body{width:600px;height:380px;background:transparent;overflow:hidden}
#hero{position:relative;width:600px;height:380px;overflow:hidden;border-radius:24px 22px 0 0 / 24px 24px 0 0;background:linear-gradient(#E9E4D8 0%,#F5F2EA 26%,#FFFFFF 56%)}
.grid{position:absolute;left:0;right:0;bottom:0;height:200px;background-image:linear-gradient(rgba(232,158,0,.34) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(232,158,0,.34) 1.5px,transparent 1.5px);background-size:50px 50px;background-position:-6px 4px;-webkit-mask-image:linear-gradient(transparent 0%,#000 55%)}
.pill{position:absolute;left:22px;top:22px;display:flex;align-items:center;gap:9px;padding:8px 18px 8px 13px;background:var(--night);border:2px solid var(--night);border-radius:999px;transform:rotate(-1.6deg);box-shadow:3px 4px 0 var(--amber);font:800 14px/1 JB;letter-spacing:.05em;color:#fff}
.pill i{width:12px;height:12px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 4px rgba(232,158,0,.38)}
h1{position:absolute;left:22px;top:68px;width:370px;font:800 68px/0.98 JB;letter-spacing:-0.06em;color:var(--night)}
h1 .a{color:var(--amber);text-shadow:3px 4px 0 var(--night)}
.sub{position:absolute;left:24px;top:212px;width:350px;font:500 16px/1.35 JB;letter-spacing:-0.03em;color:#26241E}
.sub b{color:var(--amber-t);font-weight:700}
.abs{position:absolute}
.onair{left:24px;top:262px;width:206px;height:92px;border:2.5px dashed var(--night);border-radius:12px;background:rgba(255,255,255,.82);transform:rotate(-2deg);padding:11px 14px}
.onair .l{font:600 11px/1 Plex;letter-spacing:.14em;color:var(--amber-t);text-transform:uppercase}
.bars{display:flex;align-items:flex-end;gap:5px;height:44px;margin-top:9px}
.bars u{display:block;width:9px;border-radius:3px;background:var(--amber);border:2px solid var(--night)}
.tile{z-index:6;left:542px;top:8px;width:48px;height:48px;border-radius:11px;background:var(--amber);border:4px solid #fff;box-shadow:0 0 0 2px var(--night),5px 6px 0 2px var(--night);transform:rotate(11deg);display:flex;align-items:center;justify-content:center}
.live{z-index:6;left:360px;top:244px;display:flex;align-items:center;gap:8px;padding:8px 15px 8px 12px;background:var(--amber);color:var(--night);border:3px solid #fff;border-radius:999px;box-shadow:0 0 0 2px var(--night),4px 5px 0 2px var(--night);font:800 13px/1 JB;letter-spacing:.04em;transform:rotate(-6deg)}
.live i{width:10px;height:10px;border-radius:50%;background:var(--night)}
svg.sp{position:absolute}
</style></head><body>
<div id="hero">
 <div class="grid"></div>
 <div class="pill"><i></i>AO VIVO AGORA</div>
 <h1>Estamos<br>ao <span class="a">vivo</span></h1>
 <div class="sub"><b>&gt;</b> Seu primeiro agente de IA, do zero</div>
 <div class="abs onair"><div class="l">Transmitindo agora</div><div class="bars"><u style="height:16px"></u><u style="height:30px"></u><u style="height:22px"></u><u style="height:40px"></u><u style="height:26px"></u><u style="height:34px"></u><u style="height:18px"></u><u style="height:38px"></u><u style="height:24px"></u><u style="height:30px"></u><u style="height:14px"></u></div></div>
 <svg class="sp" style="left:244px;top:262px" width="92" height="92" viewBox="0 0 92 92">
  <circle cx="50" cy="50" r="38" fill="#0D0C08"/><circle cx="46" cy="46" r="38" fill="#E89E00" stroke="#0D0C08" stroke-width="4"/>
  <circle cx="46" cy="46" r="38" fill="none" stroke="#fff" stroke-width="3" opacity=".0"/>
  <path d="M36 28 L66 46 L36 64Z" fill="#0D0C08" stroke="#0D0C08" stroke-width="5" stroke-linejoin="round"/>
 </svg>
 <div class="abs tile"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M5 3 L19 11 L5 19Z" fill="#0D0C08" stroke="#0D0C08" stroke-width="2" stroke-linejoin="round"/></svg></div>
 <div class="abs live"><i></i>ENTRA AGORA</div>
 <svg class="sp" style="left:350px;top:60px" width="26" height="26" viewBox="-13 -13 26 26"><path d="M0,-12 C1,-3 3,-1 12,0 C3,1 1,3 0,12 C-1,3 -3,1 -12,0 C-3,-1 -1,-3 0,-12Z" fill="#fff" stroke="#0D0C08" stroke-width="2" stroke-linejoin="round"/></svg>
 <svg class="sp" style="left:344px;top:318px" width="26" height="26" viewBox="-13 -13 26 26"><path d="M0,-12 C1,-3 3,-1 12,0 C3,1 1,3 0,12 C-1,3 -3,1 -12,0 C-3,-1 -1,-3 0,-12Z" fill="#E89E00" stroke="#0D0C08" stroke-width="2" stroke-linejoin="round"/></svg>
 <svg class="sp" style="left:332px;top:188px" width="22" height="26" viewBox="0 0 14 21"><path d="M1 1 L1 17 L5 13.5 L8 20 L10.5 19 L7.6 12.6 L13 12.4Z" fill="#E89E00" stroke="#0D0C08" stroke-width="1.4" stroke-linejoin="round"/></svg>
</div>
<script src="sticker.js"></script>
<script>
(async()=>{
 const hero=document.getElementById('hero');
 const m=await sticker('matteo-cut.png',{w:182,outline:6,sx:5,sy:6});
 m.style.cssText+='position:absolute;left:'+(396-m.dataset.pad)+'px;top:'+(10-m.dataset.pad)+'px;transform:rotate(3deg);transform-origin:50% 50%';
 hero.appendChild(m);
 const o=await sticker('oros-polvo.svg',{w:210,outline:6,sx:6,sy:7});
 o.style.cssText+='position:absolute;left:'+(418-o.dataset.pad)+'px;top:'+(250-o.dataset.pad)+'px;transform:rotate(-4deg)';
 hero.appendChild(o);
 await document.fonts.ready; document.body.dataset.ready='1';
})();
</script></body></html>
