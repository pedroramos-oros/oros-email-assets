<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="common.css">
<style>
html,body{width:600px;height:380px;background:transparent;overflow:hidden}
#hero{position:relative;width:600px;height:380px;overflow:hidden;border-radius:24px 22px 0 0 / 24px 24px 0 0;background:linear-gradient(#E9E4D8 0%,#F5F2EA 26%,#FFFFFF 56%)}
.grid{position:absolute;left:0;right:0;bottom:0;height:200px;
 background-image:linear-gradient(rgba(232,158,0,.34) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(232,158,0,.34) 1.5px,transparent 1.5px);
 background-size:50px 50px;background-position:-6px 4px;
 -webkit-mask-image:linear-gradient(transparent 0%,#000 55%);}
.pill{position:absolute;left:22px;top:22px;display:flex;align-items:center;gap:8px;padding:7px 18px 7px 12px;background:#fff;border:2px solid var(--night);border-radius:999px;transform:rotate(-1.6deg);box-shadow:2px 3px 0 var(--night);font:600 14.5px/1 Plex;color:var(--amber-t)}
.pill svg{width:16px;height:16px}
h1{position:absolute;left:22px;top:76px;width:352px;font:800 44px/1.02 JB;letter-spacing:-0.05em;color:var(--night)}
h1 .a{color:var(--amber);text-shadow:2px 3px 0 var(--night)}
.abs{position:absolute}
.term{left:24px;top:252px;width:166px;height:98px;border:2.5px dashed var(--night);border-radius:10px;background:rgba(255,255,255,.78);transform:rotate(-2.2deg);padding:10px 12px;font:500 11.5px/1.55 JB;color:var(--night)}
.term .dots{display:flex;gap:4px;margin-bottom:6px}.term .dots i{width:7px;height:7px;border-radius:50%;background:var(--amber)}
.term .dots i:nth-child(2){background:var(--night)} .term .dots i:nth-child(3){background:#fff;border:1.5px solid var(--night)}
.term b{color:var(--amber-t);font-weight:700}.term .cur{display:inline-block;width:7px;height:12px;background:var(--amber);vertical-align:-2px}
.sel{left:236px;top:262px;width:92px;height:62px;border:1.6px dashed var(--night);display:flex;align-items:center;justify-content:center;font:800 28px/1 JB;color:var(--amber-t);letter-spacing:-0.05em;transform:rotate(2deg)}
.sel i{position:absolute;width:7px;height:7px;background:var(--night)}
.sel i:nth-child(1){left:-4px;top:-4px}.sel i:nth-child(2){right:-4px;top:-4px}.sel i:nth-child(3){left:-4px;bottom:-4px}.sel i:nth-child(4){right:-4px;bottom:-4px}
.tile{z-index:6;left:542px;top:8px;width:48px;height:48px;border-radius:11px;background:var(--amber);border:4px solid #fff;box-shadow:0 0 0 2px var(--night),5px 6px 0 2px var(--night);transform:rotate(11deg);display:flex;align-items:center;justify-content:center}
.live{z-index:6;left:366px;top:244px;display:flex;align-items:center;gap:8px;padding:7px 14px 7px 11px;background:var(--night);color:#fff;border:3px solid #fff;border-radius:999px;box-shadow:0 0 0 2px var(--night),4px 5px 0 2px var(--night);font:800 12.5px/1 JB;letter-spacing:.04em;transform:rotate(-6deg)}
.live i{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 3px rgba(232,158,0,.35)}
svg.sp{position:absolute}
</style></head><body>
<div id="hero">
 <div class="grid"></div>
 <div class="pill"><svg viewBox="-12 -12 24 24"><path d="M0,-11 C1,-3 3,-1 11,0 C3,1 1,3 0,11 C-1,3 -3,1 -11,0 C-3,-1 -1,-3 0,-11Z" fill="#E89E00" stroke="#0D0C08" stroke-width="1.6" stroke-linejoin="round"/></svg>Live gratuita no YouTube</div>
 <h1>Seu primeiro <span class="a">agente</span> de IA, do zero</h1>
 <div class="abs term"><div class="dots"><i></i><i></i><i></i></div><b>$</b> claude<br><b>&gt;</b> monte meu agente<br><b>&gt;</b> pronto, rodando <span class="cur"></span></div>
 <div class="abs sel"><i></i><i></i><i></i><i></i>&gt;_</div>
 <div class="abs tile"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M5 3 L19 11 L5 19Z" fill="#0D0C08" stroke="#0D0C08" stroke-width="2" stroke-linejoin="round"/></svg></div>
 <div class="abs live"><i></i>AO VIVO</div>
 <svg class="sp" style="left:328px;top:60px" width="26" height="26" viewBox="-13 -13 26 26"><path d="M0,-12 C1,-3 3,-1 12,0 C3,1 1,3 0,12 C-1,3 -3,1 -12,0 C-3,-1 -1,-3 0,-12Z" fill="#fff" stroke="#0D0C08" stroke-width="2" stroke-linejoin="round"/></svg>
 <svg class="sp" style="left:344px;top:318px" width="26" height="26" viewBox="-13 -13 26 26"><path d="M0,-12 C1,-3 3,-1 12,0 C3,1 1,3 0,12 C-1,3 -3,1 -12,0 C-3,-1 -1,-3 0,-12Z" fill="#E89E00" stroke="#0D0C08" stroke-width="2" stroke-linejoin="round"/></svg>
 <svg class="sp" style="left:196px;top:300px" width="22" height="26" viewBox="0 0 14 21"><path d="M1 1 L1 17 L5 13.5 L8 20 L10.5 19 L7.6 12.6 L13 12.4Z" fill="#0D0C08" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
 <svg class="sp" style="left:318px;top:196px" width="22" height="26" viewBox="0 0 14 21"><path d="M1 1 L1 17 L5 13.5 L8 20 L10.5 19 L7.6 12.6 L13 12.4Z" fill="#E89E00" stroke="#0D0C08" stroke-width="1.4" stroke-linejoin="round"/></svg>
 <div id="stk"></div>
</div>
<script src="sticker.js"></script>
<script>
(async()=>{
 const hero=document.getElementById('hero');
 const m=await sticker('matteo-cut.png',{w:182,outline:6,sx:5,sy:6});
 m.style.cssText+='position:absolute;left:'+(396-m.dataset.pad)+'px;top:'+(10-m.dataset.pad)+'px;transform:rotate(3deg);transform-origin:50% 50%';
 hero.appendChild(m);
 const o=await sticker('oros-polvo.svg',{w:210,outline:6,sx:6,sy:7});
 o.style.cssText+='position:absolute;left:'+(418-o.dataset.pad)+'px;top:'+(250-o.dataset.pad)+'px;transform:rotate(-4deg)';
 hero.appendChild(o);
 await document.fonts.ready; document.body.dataset.ready='1';
})();
</script></body></html>
